<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Forge</title>
<style>

:root { --bg:#f5f6f8; --panel:#fff; --ink:#1a1d23; --muted:#667085; --line:#e3e6eb; --accent:#4f46e5; --accent-ink:#fff; --soft:#eef0ff; --ok:#12805c; --icon:#1a1d23; --shadow:0 1px 2px rgba(16,24,40,.06); }
:root[data-theme="dark"] { --bg:#101216; --panel:#181b21; --ink:#eceff4; --muted:#98a2b3; --line:#2a2f38; --accent:#8b8cf8; --accent-ink:#101216; --soft:#23253a; --ok:#4ade80; --icon:#eceff4; --shadow:none;  color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; }
.top { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
.brand { font-weight:700; font-size:18px; display:flex; align-items:center; gap:8px; border:0; background:transparent; padding:0; border-radius:10px; }
.hometiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:18px; margin-top:8px; }
.hometile { text-align:left; display:flex; flex-direction:column; gap:10px; padding:22px; border:2px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:var(--shadow); min-height:220px; transition:border-color .15s, transform .15s; }
.hometile:hover { border-color:var(--accent); transform:translateY(-2px); }
.hometile h2 { margin:0; font-size:20px; }
.hometile p { margin:0; color:var(--muted); }
.hometile .go { margin-top:auto; color:var(--accent); font-weight:600; }
.hometile .hnote { color:#b45309; font-size:13px; font-weight:600; }
.hico { width:46px; height:46px; border-radius:12px; background:var(--soft); display:grid; place-items:center; color:var(--accent); }
.hico svg { width:26px; height:26px; }
.covers { display:flex; gap:8px; align-items:center; min-height:46px; }
.covers .ic { width:38px; height:38px; color:var(--icon); }
.libgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px; margin-top:14px; }
.setcard { text-align:left; display:flex; flex-direction:column; gap:6px; padding:12px; border:2px solid var(--line); border-radius:14px; background:var(--panel); }
.setcard:hover { border-color:var(--accent); }
.setcard .cv { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; padding:8px; border-radius:10px; background:var(--bg); min-height:120px; align-content:center; }
.setcard .cv .ic { width:100%; height:48px; color:var(--icon); }
.setcard b { word-break:break-word; text-transform:capitalize; }
.setcard small { color:var(--muted); }
.btn.danger { background:#dc2626; color:#fff; border-color:#dc2626; font-weight:600; }
.btn.danger:hover { filter:brightness(1.08); }
.canvas.mv { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
.canvas.mv.drag { cursor:grabbing; border-color:var(--accent); }
.tile .bchk { position:absolute; top:9px; left:9px; width:18px; height:18px; min-width:0; padding:0; margin:0; border:0; background:transparent; accent-color:var(--accent); cursor:pointer; }
.bselbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 12px; margin:0 0 12px; border:1px solid var(--accent); background:var(--soft); border-radius:10px; position:sticky; top:78px; z-index:4; }
.bselbar[hidden] { display:none; }
.pvbar { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; margin:2px 0 12px; }
.pvg { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
.pvl { color:var(--muted); font-size:14px; display:inline-flex; align-items:center; gap:8px; }
.seg .sw { display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid var(--muted); margin-right:6px; vertical-align:-1px; }
.sample.pv { min-height:180px; border-style:solid; border-radius:12px; padding:18px; gap:18px 22px; transition:background .15s; }
.pvi { display:inline-flex; }
.rmtext { width:100%; color:#dc2626; }
.rmtext:hover { background:rgba(220,38,38,.1); border-color:#dc2626; }
.setwrap { position:relative; display:flex; flex-direction:column; }
.setwrap .setcard { flex:1; }
.setbin { position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:#dc2626; display:grid; place-items:center; opacity:0; transition:opacity .15s; }
.setbin svg { width:17px; height:17px; }
.setwrap:hover .setbin, .setbin:focus-visible { opacity:1; }
.setbin:hover { background:rgba(220,38,38,.1); border-color:#dc2626; }
@media (hover:none) { .setbin { opacity:.9; } }
.libbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:4px; }
.libbar input[type=text] { max-width:340px; }
.brand img { width:32px; height:32px; border-radius:8px; display:block; }
.steps { display:flex; gap:4px; flex:1; flex-wrap:wrap; }
.step { display:flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); }
.step b { display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--line); color:var(--ink); font-size:12px; }
.step.on { background:var(--soft); border-color:var(--accent); color:var(--ink); }
.step.on b { background:var(--accent); color:var(--accent-ink); }
.step:disabled { opacity:.5; cursor:default; }
.basketchip { display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel); }
.basketchip span { background:var(--accent); color:var(--accent-ink); min-width:22px; height:22px; border-radius:11px; display:grid; place-items:center; font-size:12px; padding:0 6px; }
main { max-width:1100px; margin:0 auto; padding:24px 20px 120px; }
h1 { font-size:22px; margin:0 0 4px; }
.lead { color:var(--muted); margin:0 0 20px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
input[type=text] { flex:1; min-width:180px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
input[type=text]:focus { outline:2px solid var(--accent); outline-offset:1px; }
.btn { padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--panel); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
.btn:disabled { opacity:.45; cursor:default; }
.btn.small { padding:6px 10px; font-size:13px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0; }
.chip { display:flex; align-items:center; gap:6px; padding:6px 8px 6px 12px; border-radius:999px; background:var(--soft); border:1px solid var(--line); }
.chip button { border:0; background:transparent; width:22px; height:22px; border-radius:50%; color:var(--muted); }
.chip button:hover { background:var(--line); }
.opts { display:flex; flex-wrap:wrap; gap:16px 28px; margin-top:18px; color:var(--muted); align-items:center; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; vertical-align:middle; }
.seg button { border:0; background:var(--panel); padding:7px 14px; }
.seg button.on { background:var(--accent); color:var(--accent-ink); font-weight:600; }
select { padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); font-size:13px; }
.stepper { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.stepper button { border:0; background:var(--panel); width:32px; height:34px; }
.stepper output { min-width:34px; text-align:center; color:var(--ink); }
.gen { display:grid; gap:10px; margin-top:20px; }
.gen .g { display:grid; grid-template-columns:130px 1fr 50px; gap:12px; align-items:center; }
.bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
.bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
.section { margin-top:22px; }
.sh { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
.sh h2 { font-size:16px; margin:0; flex:1; }
.sh small { color:var(--muted); font-weight:400; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:10px; }
.tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px 10px; border:2px solid var(--line); border-radius:12px; background:var(--panel); }
button.tile:hover { border-color:var(--accent); }
.tile.sel { border-color:var(--accent); background:var(--soft); }
.tile svg.ic { width:64px; height:64px; color:var(--icon); }
.tile .tick { position:absolute; top:6px; left:6px; width:20px; height:20px; border-radius:50%; border:2px solid var(--line); background:var(--panel); display:grid; place-items:center; font-size:12px; color:transparent; }
.tile.sel .tick { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.tile .in { position:absolute; top:6px; right:6px; font-size:11px; color:var(--ok); }
.tile .rm { position:absolute; top:4px; right:4px; border:0; background:transparent; color:var(--muted); width:22px; height:22px; border-radius:50%; }
.tile .rm:hover { background:var(--line); }
.tile input { width:100%; min-width:0; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); font-size:12px; text-align:center; }
.dock { position:fixed; left:0; right:0; bottom:0; padding:12px 20px; background:var(--panel); border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:flex-end; z-index:6; }
.dock .msg { margin-right:auto; color:var(--muted); }
.two { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; }
.two.ed { grid-template-columns:minmax(0,1fr) 340px; }
.two.vv { grid-template-columns:260px minmax(0,1fr); }
@media (max-width:820px) { .two, .two.ed, .two.vv { grid-template-columns:1fr; } }
.vorig .ic { width:200px; height:200px; margin:0 auto; color:var(--icon); }
.vname { text-align:center; font-weight:600; margin-top:6px; word-break:break-all; }
.vnote { color:var(--muted); font-size:13px; margin:8px 0 0; }
.vl { display:block; color:var(--muted); font-size:13px; margin:0 0 4px; }
.vrow { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-top:12px; color:var(--muted); }
.vrow > span:first-child { min-width:118px; }
.vchk { display:flex; gap:8px; align-items:center; margin-top:12px; color:var(--muted); }
.vsl { grid-template-columns:150px 1fr 56px; }
.vdet { margin-top:14px; color:var(--muted); }
.vdet summary { cursor:pointer; }
.vdet textarea { width:100%; margin-top:8px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:13px/1.45 ui-monospace, Consolas, monospace; resize:vertical; }
.vv input[type=text] { width:100%; }
.navsep { width:1px; align-self:stretch; background:var(--line); margin:3px 4px; }
.ndot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-left:6px; animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.25; } }
.hint { border-color:var(--accent); background:var(--soft); margin:0 0 14px; }
.side label { display:block; color:var(--muted); font-size:13px; margin:12px 0 4px; }
.side input[type=text] { width:100%; }
.sample { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:12px; border:1px dashed var(--line); border-radius:10px; margin-top:8px; }
.sample svg { width:var(--s,32px); height:var(--s,32px); color:var(--c,var(--icon)); }
.done { border-color:var(--ok); }
.done h2 { color:var(--ok); margin:0 0 6px; font-size:18px; }
.files { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.files code { padding:4px 10px; border-radius:8px; background:var(--soft); border:1px solid var(--line); font-size:13px; }
pre { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; margin:10px 0 0; }
.empty { text-align:center; color:var(--muted); padding:36px 12px; }
.note { margin-top:26px; color:var(--muted); font-size:13px; text-align:center; }

.ic { display:block; width:64px; height:64px; background:currentColor; -webkit-mask:var(--u) center/contain no-repeat; mask:var(--u) center/contain no-repeat; }
.tile .ic { color:var(--icon); width:var(--tile,64px); height:var(--tile,64px); }
.sample .ic { width:var(--s,32px); height:var(--s,32px); color:var(--c,var(--icon)); }
.pill { display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-size:13px; }
.pill i { width:9px; height:9px; border-radius:50%; background:#c2410c; }
.pill.up i { background:#16a34a; }
.err { margin-top:14px; padding:10px 12px; border-radius:10px; border:1px solid #c2410c; background:rgba(194,65,12,.08); }
.badge { position:absolute; top:6px; right:6px; font-size:11px; color:var(--ok); }
.libs { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
.libs h3 { margin:0 0 8px; font-size:14px; color:var(--muted); font-weight:600; }
pre.log { max-height:160px; font-size:12px; color:var(--muted); }
a.btn { text-decoration:none; display:inline-block; color:inherit; }
.fr { display:block; overflow:hidden; width:var(--tile,64px); height:var(--tile,64px); }
.sample .fr { width:var(--s,32px); height:var(--s,32px); }
.fr .ic { width:100%; height:100%; }
.canvas { position:relative; width:min(100%,420px); aspect-ratio:1; margin:0 auto; border:1px dashed var(--muted); border-radius:8px; background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat, linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat; }
.canvas .fr { width:100%; height:100%; }
.canvas .fr .ic { color:var(--icon); }
.ctl { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0 6px; }
.sl { display:grid; grid-template-columns:110px 1fr 56px; gap:10px; align-items:center; margin:8px 0; color:var(--muted); font-size:14px; }
.sl output { color:var(--ink); text-align:right; }
.edgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(78px,1fr)); gap:8px; --tile:52px; }
.edgrid .tile { padding:8px 4px 6px; }
.ctxm { position:fixed; z-index:20; min-width:200px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
.ctxm button { display:block; width:100%; text-align:left; border:0; background:transparent; padding:8px 12px; border-radius:6px; }
.ctxm button:hover { background:var(--soft); }
#toast { position:fixed; bottom:78px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
#toast.show { opacity:1; }
#cleansvg path { cursor:pointer; }
#cleansvg path:hover { fill:var(--accent); }
#cleansvg path.s { fill:#dc2626; }
.seg.mode { margin-left:auto; }
.slots { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.slot { position:relative; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:14px; font-weight:700; background:var(--line); color:var(--muted); }
.slot.ok { background:var(--ok); color:#fff; }
.slot.bad { background:#c2410c; color:#fff; }
.slot.now { background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); color:var(--ink); }
.slot.now::before { content:''; position:absolute; inset:4px; border-radius:50%; background:var(--panel); }
.slot.now::after { content:''; position:absolute; inset:-3px; border-radius:50%; border:3px solid transparent; border-top-color:var(--accent); animation:spin 1s linear infinite; }
.slot.now span { position:relative; z-index:1; font-size:11px; }
@keyframes spin { to { transform:rotate(360deg); } }
.genmsg { color:var(--muted); font-size:14px; }
.genmsg b { color:var(--ink); }
.gear { display:grid; place-items:center; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--muted); }
.gear:hover { color:var(--ink); border-color:var(--accent); }
.gear svg { width:20px; height:20px; }
.modalbg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:grid; place-items:center; padding:16px; }
.modalbg[hidden] { display:none; }
.modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
.modal h2 { margin:0 0 4px; font-size:18px; }
.warnbox { display:flex; align-items:center; gap:10px; margin:14px 0 0; padding:10px 12px; border-radius:10px; background:rgba(245,158,11,.16); border:1px solid rgba(245,158,11,.6); color:var(--ink); font-size:14px; }
.warnicon { flex:none; width:22px; height:22px; border-radius:50%; background:#f59e0b; color:#1c1917; font-weight:800; font-size:15px; line-height:22px; text-align:center; }
.wsteps { display:flex; align-items:center; gap:6px; margin-bottom:12px; color:var(--muted); font-size:13px; }
.wsteps i { width:30px; height:5px; border-radius:3px; background:var(--line); }
.wsteps i.on { background:var(--accent); }
.wsteps span { margin-left:6px; }
.modal .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; margin:14px 0; font-size:14px; }
.modal .kv span:nth-child(odd) { color:var(--muted); }
.modal code { word-break:break-all; }
.grid { grid-template-columns:repeat(auto-fill, minmax(max(118px, calc(var(--tile,64px) + 44px)), 1fr)); }

.dlbar { position:fixed; top:0; left:0; right:0; height:4px; z-index:50; background:var(--line); }
.dlbar[hidden] { display:none; }
.dlbar i { display:block; height:100%; width:0; background:var(--accent); transition:width .6s ease; }
.bar.big { height:12px; border-radius:6px; margin-top:4px; }
.bar.big i { border-radius:6px; }
.dlinfo { margin-top:8px; font-size:14px; color:var(--muted); }
.dlinfo b { color:var(--ink); }
/* theme choice */
.themes { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0 6px; }
.themeopt { display:flex; flex-direction:column; gap:10px; align-items:center; padding:14px 12px 12px; border:2px solid var(--line); border-radius:14px; background:var(--panel); font-weight:600; }
.themeopt:hover { border-color:var(--accent); }
.themeopt .sw { width:100%; aspect-ratio:16/10; border-radius:8px; border:1px solid #d0d5dd; display:grid; grid-template-rows:22% 1fr; overflow:hidden; }
.themeopt .sw i { background:#fff; border-bottom:1px solid #e3e6eb; }
.themeopt .sw b { display:block; margin:12% 14%; border-radius:6px; background:#fff; border:1px solid #e3e6eb; }
.themeopt .sw.light { background:#f5f6f8; }
.themeopt .sw.dark { background:#101216; border-color:#2a2f38; }
.themeopt .sw.dark i, .themeopt .sw.dark b { background:#181b21; border-color:#2a2f38; }
/* long icon names are cut short instead of running into the next tile */
button.tile { min-width:0; }
button.tile > span:last-child { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* button movement */
button, .btn, .tile, .chip, .step { transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease; }
.btn:not(:disabled):hover, .step:not(:disabled):hover, .basketchip:hover, .chip:not(:disabled):hover, .pill:hover { transform:translateY(-1px); box-shadow:0 3px 8px rgba(16,24,40,.14); }
button.tile:hover { transform:translateY(-2px); box-shadow:0 4px 10px rgba(16,24,40,.14); }
.btn.primary:not(:disabled):hover { box-shadow:0 4px 12px rgba(79,70,229,.35); filter:brightness(1.06); }
.btn:not(:disabled):active, .step:not(:disabled):active, .basketchip:active, .chip:not(:disabled):active, button.tile:active, .gear:active { transform:translateY(0) scale(.96); box-shadow:none; transition-duration:.05s; }
.gear { transition:transform .35s ease, color .15s ease, border-color .15s ease; }
.gear:hover { transform:rotate(60deg); }
.seg button, .stepper button, .chip button, .rm { transition:background-color .15s ease, color .15s ease, transform .1s ease; }
.seg button:active, .stepper button:active { transform:scale(.92); }
button:focus-visible, .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.btn:disabled, button:disabled { cursor:default; }
.btn.busy { display:inline-flex; align-items:center; gap:8px; }
.btn .spin { width:14px; height:14px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; }
.modalbg:not([hidden]) { animation:fadein .15s ease; }
.modalbg:not([hidden]) .modal { animation:popin .18s ease; }
#toast { transform:translate(-50%, 8px); transition:opacity .2s ease, transform .2s ease; }
#toast.show { transform:translate(-50%, 0); }
@keyframes fadein { from { opacity:0; } }
@keyframes popin { from { opacity:0; transform:translateY(8px) scale(.97); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; } .gear:hover { transform:none; } }
</style></head><body>
<header class="top">
  <button class="brand" data-go="0" title="Home" aria-label="Icon Forge home"><img src="/app-icon.png" alt="" width="32" height="32">Icon Forge</button>
  <nav class="steps" id="steps"></nav>
  <span class="pill" id="comfy" title="Open settings"><i></i><span>Model…</span></span>
  <button class="basketchip" id="chip" aria-label="Open basket">Basket <span id="chipn">0</span></button>
  <button class="gear" id="gear" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<div class="dlbar" id="dlbar" hidden><i></i></div>
<div class="modalbg" id="modal" hidden></div>
<div class="modalbg" id="themeask" hidden></div>
<div class="modalbg" id="cfm" hidden></div>
<main id="app"></main>
<div class="dock" id="dock" hidden></div>
<div id="toast" role="status"></div>
<script>
const DETAIL = { 1:['Simple','very thick outline, few bold shapes. Best at small sizes.'], 2:['Medium','your usual look: thick outline with some inner detail.'], 3:['Detailed','fine lines and interior detail. Best at 48px and larger, slower to trace.'] };
const STYLES = { line:['Line', 'outline strokes, no fill (your current look).'], filled:['Filled', 'solid silhouettes with small cut-out details.'], double:['Double line', 'a bold outline with a thin line inside it.'], hand:['Hand-drawn', 'a wobbly ink line, loose and friendly.'] };
const S = { step:0, libOpen:null, libQ:'', vary:null, libHint:false, bTab:'icons', bSel:new Set(), bLast:-1, pv:{ bg:'#ffffff', col:'#1a1d23', size:32, touched:false }, kws:[], per:5, detail:2, ready:false, lib:[], model:{}, settings:false, theme:'', sets:[], sel:new Set(), basket:[], font:'myIcons', genKws:[], job:null, jobErr:'', building:false, size:64, edSel:0, edMode:'move', cleanSel:new Set(), speck:40, style:'line', result:null, fontErr:'' };
const $ = s => document.querySelector(s), esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'icons';
const key = (f, n) => f + '/' + n;
const url = (f, n) => '/svg/' + encodeURIComponent(f) + '/' + encodeURIComponent(n);
const ic = (f, n, cls) => '<span class="ic ' + (cls || '') + '" style="--u:url(\'' + url(f, n) + '\')"></span>';
const inBasket = k => S.basket.some(b => b.key === k);
const post = (u, b) => fetch(u, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b) }).then(r => r.json());

async function refresh() {
  try { const r = await (await fetch('/api/status')).json(); S.ready = r.model.ready; S.model = r.model; S.lib = r.library; S.theme = r.theme || ''; } catch (e) { S.ready = false; }
  const p = $('#comfy'); p.className = 'pill' + (S.ready ? ' up' : ''); p.lastChild.textContent = S.model.downloading ? 'Downloading model ' + Math.round(S.model.percent) + '%' + (S.model.speed ? ' · ' + (S.model.speed / 1e6).toFixed(1) + ' MB/s' : '') : S.ready ? 'Flux model ready' : 'Flux model not installed';
  const bar = $('#dlbar'); if (bar) { bar.hidden = !S.model.downloading; bar.firstChild.style.width = (S.model.percent || 0) + '%'; }
  if (S.wasDl && !S.model.downloading && S.ready) toast('Flux model downloaded and ready');
  S.wasDl = !!S.model.downloading;
}
function go(n) { S.step = n; if (n === 5) S.libOpen = null; if (n === 0) S.libHint = false; render(); window.scrollTo(0, 0); }
function renderTop() {
  // The bar shows where you are and lets you reach every screen. A pulsing dot marks work that is still drawing.
  const names = ['Keywords', 'Pick icons', 'Edit SVGs', 'Basket & font'];
  const dot = '<i class="ndot" title="Drawing…"></i>', kwBusy = !!S.job, varyBusy = typeof varyRunning === 'function' && varyRunning();
  const plain = (go, label, on, extra) => '<button class="step ' + (on ? 'on' : '') + '" data-go="' + go + '"' + (extra || '') + '>' + label + '</button>';
  $('#steps').innerHTML = plain(0, 'Home', S.step === 0) + plain(5, 'Library', S.step === 5) + '<span class="navsep"></span>' +
    names.map((t, i) => plain(i + 1, '<b>' + (i + 1) + '</b>' + t + (i === 0 && kwBusy ? dot : ''), S.step === i + 1, (i === 1 && !S.sets.length) || (i === 2 && !S.basket.length) ? ' disabled' : '')).join('') +
    (S.vary && (S.step === 6 || varyBusy) ? '<span class="navsep"></span>' + plain(6, 'Vary' + (varyBusy ? dot : ''), S.step === 6) : '');
  $('#steps').style.visibility = '';
  $('#chipn').textContent = S.basket.length;
}
function render() { renderTop(); $('#dock').hidden = true; if (S.step === 0) viewHome(); else if (S.step === 6) viewVary(); else if (S.step === 5) viewLibrary(); else if (S.step === 1) viewKeywords(); else if (S.step === 2) viewPick(); else if (S.step === 3) viewEdit(); else viewBasket(); }

// ---- Home: two big tiles ----
const prettyName = f => f.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) : '';
const newest = () => S.lib.slice().sort((a, b) => (b.mtime || 0) - (a.mtime || 0) || a.folder.localeCompare(b.folder));
function viewHome() {
  const sets = S.lib.length, icons = S.lib.reduce((a, l) => a + l.files.length, 0);
  const covers = newest().slice(0, 5).map(l => ic(l.folder, l.files[0])).join('');
  $('#app').innerHTML = '<h1>What would you like to do?</h1><p class="lead">Make a brand new set of icons, or reuse icons you made before.</p>' +
    '<div class="hometiles">' +
    '<button class="hometile" data-go="1"><span class="hico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15v4M17 17h4"/></svg></span><h2>Make new icons</h2><p>Type a word and the AI draws a set of icons for you. Four quick steps, then your icon font.</p>' +
    (S.ready ? '' : '<span class="hnote">! Needs the AI model first. Press the gear to download it.</span>') + '<span class="go">Start →</span></button>' +
    '<button class="hometile" data-go="5"><span class="hico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><h2>My library</h2><p>' +
    (sets ? icons + ' icons in ' + sets + ' set' + (sets === 1 ? '' : 's') + ' you made before. Pick some and add them to your basket.' : 'Your past icon sets will show up here once you have made some.') + '</p>' +
    (covers ? '<span class="covers">' + covers + '</span>' : '') + '<span class="go">Open library →</span></button>' +
    '<button class="hometile" data-varyhome="1"><span class="hico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="11" height="11" rx="2"/><path d="M17 4h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-1"/></svg></span><h2>Vary an icon</h2><p>' +
    (icons ? 'Pick one of your icons, change the words, and the AI draws new versions of it. The new versions are saved next to the original.' : 'Once you have an icon, you can change its words here and the AI draws new versions of it.') + '</p><span class="go">Pick an icon →</span></button></div>' +
    (S.basket.length ? '<div class="card row" style="margin-top:18px"><span><b>' + S.basket.length + ' icon' + (S.basket.length === 1 ? '' : 's') + '</b> waiting in your basket.</span><button class="btn primary" data-go="4" style="margin-left:auto">Open basket</button></div>' : '');
}

// ---- Library: every set you made before ----
function viewLibrary() {
  document.documentElement.style.setProperty('--tile', S.size + 'px');
  const open = S.libOpen ? S.lib.find(l => l.folder === S.libOpen) : null;
  if (!open) S.libOpen = null;
  const hint = S.libHint ? '<div class="card hint"><b>To vary an icon:</b> ' + (open ? 'tick one icon, then press <b>Vary this icon…</b> in the bar at the bottom.' : 'open a set, tick one icon, then press <b>Vary this icon…</b> in the bar at the bottom.') + '</div>' : '';
  if (open) {
    $('#app').innerHTML = hint + '<h1>' + esc(prettyName(open.folder)) + '</h1><p class="lead">' + open.files.length + ' icons' + (open.mtime ? ' · ' + fmtDate(open.mtime) : '') + '. Click icons to select them, then add them to the basket. <b>Tip:</b> right-click any icon to copy it.</p>' +
      '<div class="libbar"><button class="btn" data-libopen="">← All sets</button><button class="btn small" data-liball="1">Select all</button><button class="btn small" data-revealset="' + esc(open.folder) + '">Show in folder</button><button class="btn small rmtext" style="width:auto" data-delset="' + esc(open.folder) + '">Delete set…</button><label style="color:var(--muted);margin-left:auto">Icon size <input type="range" id="tsz" min="32" max="160" value="' + S.size + '"> <span id="tszv">' + S.size + 'px</span></label></div>' +
      '<section class="section card"><div class="grid">' + open.files.map(f => { const k = key(open.folder, f); return '<button class="tile ' + (S.sel.has(k) ? 'sel' : '') + '" data-pick="' + esc(k) + '" aria-pressed="' + S.sel.has(k) + '"><span class="tick">✓</span>' + (inBasket(k) ? '<span class="badge">in basket</span>' : '') + ic(open.folder, f) + '<span style="font-size:12px;color:var(--muted)">' + esc(f.replace(/\.svg$/i, '')) + '</span></button>'; }).join('') + '</div></section>';
    dockPick();
    return;
  }
  $('#app').innerHTML = hint + '<h1>My library</h1><p class="lead">Every icon set you have made. Open a set to pick icons for your basket.</p>' +
    '<div class="libbar"><input type="text" id="libq" placeholder="Search sets and icons" autocomplete="off" value="' + esc(S.libQ) + '"><span id="libn" style="color:var(--muted)"></span><button class="btn primary" data-go="1" style="margin-left:auto">+ Make new icons</button></div><div id="libgrid"></div>';
  drawLibGrid();
  dockPick();
}
function drawLibGrid() {
  const g = $('#libgrid'); if (!g) return;
  const q = S.libQ.trim().toLowerCase(), all = newest();
  const list = q ? all.filter(l => l.folder.toLowerCase().includes(q) || prettyName(l.folder).toLowerCase().includes(q) || l.files.some(f => f.toLowerCase().includes(q))) : all;
  $('#libn').textContent = q ? list.length + ' of ' + all.length + ' sets' : all.length + ' set' + (all.length === 1 ? '' : 's');
  g.innerHTML = !all.length ? '<div class="empty">No icon sets yet. <button class="btn primary" data-go="1">Make your first set</button></div>'
    : !list.length ? '<div class="empty">Nothing matches "' + esc(S.libQ) + '".</div>'
    : '<div class="libgrid">' + list.map(l => '<div class="setwrap"><button class="setcard" data-libopen="' + esc(l.folder) + '"><span class="cv">' + l.files.slice(0, 4).map(f => ic(l.folder, f)).join('') + '</span><b>' + esc(prettyName(l.folder)) + '</b><small>' + l.files.length + ' icons' + (l.mtime ? ' · ' + fmtDate(l.mtime) : '') + '</small></button>' +
      '<button class="setbin" data-delset="' + esc(l.folder) + '" title="Delete this set" aria-label="Delete the set ' + esc(prettyName(l.folder)) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div>').join('') + '</div>';
}

function viewKeywords() {
  const busy = !!S.job;
  const mins = Math.max(1, Math.round(S.kws.length * S.per * 60 / 60));
  $('#app').innerHTML =
    '<h1>1. Add your keywords</h1><p class="lead">Each keyword is drawn by Flux Schnell on your PC and traced to SVG. Add as many as you like.</p>' +
    '<div class="card"><form class="row" id="kwform"><input type="text" id="kwin" placeholder="Type a keyword, e.g. bicycle, then press Enter" autocomplete="off"' + (busy ? ' disabled' : '') + '><button class="btn" type="submit"' + (busy ? ' disabled' : '') + '>Add keyword</button></form>' +
    '<div class="chips">' + (S.kws.length ? S.kws.map((k, i) => '<span class="chip">' + esc(k) + '<button data-rm="' + i + '" aria-label="Remove ' + esc(k) + '"' + (busy ? ' disabled' : '') + '>×</button></span>').join('') : '<span class="empty" style="padding:6px 0">No keywords yet.</span>') + '</div>' +
    '<div class="opts"><span>Icons per keyword <span class="stepper"><button data-per="-1" aria-label="Fewer"' + (busy ? ' disabled' : '') + '>−</button><output>' + S.per + '</output><button data-per="1" aria-label="More"' + (busy ? ' disabled' : '') + '>+</button></span></span>' +
    '<span>About ' + (S.kws.length * S.per) + ' icons, roughly ' + mins + ' min</span></div>' +
    '<div class="opts" style="margin-top:12px"><span>Detail <span class="seg">' + [1,2,3].map(n => '<button data-detail="' + n + '" class="' + (S.detail === n ? 'on' : '') + '"' + (busy ? ' disabled' : '') + '>' + DETAIL[n][0] + '</button>').join('') + '</span></span><span style="flex:1;min-width:220px"><b style="color:var(--ink)">' + DETAIL[S.detail][0] + ':</b> ' + DETAIL[S.detail][1] + '</span></div>' +
    '<div class="opts" style="margin-top:12px"><span>Style <span class="seg">' + Object.keys(STYLES).map(k => '<button data-style="' + k + '" class="' + (S.style === k ? 'on' : '') + '"' + (busy ? ' disabled' : '') + '>' + STYLES[k][0] + '</button>').join('') + '</span></span><span style="flex:1;min-width:220px"><b style="color:var(--ink)">' + STYLES[S.style][0] + ':</b> ' + STYLES[S.style][1] + '</span></div>' +
    '<div class="gen" id="gen"></div>' + (S.jobErr ? '<div class="err">' + esc(S.jobErr) + '</div>' : '') +
    (S.lib.length ? '<div class="libs"><h3>Or start from icons you already have</h3><div class="chips" style="margin:0">' + S.lib.map(l => '<button class="chip" style="cursor:pointer" data-uselib="' + esc(l.folder) + '"' + (S.sets.some(s => s.folder === l.folder) ? ' disabled' : '') + '>' + esc(l.folder) + ' · ' + l.files.length + '</button>').join('') + '</div></div>' : '') +
    '</div>';
  if (busy) drawGen();
  dockKeywords();
}
function dockKeywords() {
  const d = $('#dock'); d.hidden = false;
  if (!S.job) {
    const n = S.kws.length * S.per;
    d.innerHTML = '<span class="msg">' + (S.kws.length ? S.kws.length + ' keyword' + (S.kws.length === 1 ? '' : 's') + ' · about ' + n + ' icon' + (n === 1 ? '' : 's') : 'Add a keyword to start') + '</span><button class="btn" data-go="0">← Back</button><button class="btn primary" id="gobtn"' + (S.kws.length ? '' : ' disabled') + '>Generate ' + n + ' icon' + (n === 1 ? '' : 's') + '</button>';
    return;
  }
  d.innerHTML = '<span class="msg">' + (S.stopping ? 'Stopping, the icons already drawn are kept…' : 'Drawing icons…') + '</span><button class="btn primary" id="stopbtn"' + (S.stopping ? ' disabled' : '') + '>' + (S.stopping ? 'Stopping…' : '■ Stop generating') + '</button>';
}
async function stopGen() {
  if (!S.job || S.stopping) return;
  S.stopping = true; dockKeywords();
  try { await post('/api/generate/cancel', { id:S.job.id }); } catch (e) { S.stopping = false; dockKeywords(); }
}
function drawGen() {
  const g = $('#gen'); if (!g) return;
  const job = S.job, cur = job.current, avg = job.avgMs || 60000, now = Date.now();
  const fmt = ms => { const t = Math.max(1, Math.round(ms / 1000)); return t >= 60 ? Math.floor(t / 60) + ' min ' + (t % 60) + ' s' : t + ' s'; };
  let msg = '';
  if (cur) {
    const el = now - cur.startedAt, est = cur.first ? (job.avgMs || 60000) + 60000 : avg;
    msg = cur.first
      ? '<b>Loading the Flux model and drawing the first icon.</b> This one takes a little longer (about ' + fmt(est) + '), the rest are quicker. ' + fmt(el) + ' so far.'
      : '<b>Drawing ' + esc(cur.keyword) + ' icon ' + cur.n + ' of ' + job.per + '.</b> About ' + fmt(Math.max(0, est - el)) + ' left for this one.';
  } else if (job.stage) msg = '<b>' + esc(job.stage) + '…</b>';
  g.innerHTML = (msg ? '<div class="genmsg">' + msg + '</div>' : '') + S.genKws.map(k => {
    const it = (job.items || []).find(x => x.keyword === k);
    const n = it ? it.done + it.failed : 0, t = it ? it.total : job.per;
    const active = cur && cur.keyword === k ? cur : null;
    const frac = active ? Math.min(0.95, (now - active.startedAt) / (active.first ? (job.avgMs || 60000) + 60000 : avg)) : 0;
    const pct = Math.round((n + frac) / t * 100);
    let slots = '';
    for (let i = 0; i < t; i++) {
      if (i < (it ? it.done : 0)) slots += '<span class="slot ok" title="Done">✓</span>';
      else if (i < n) slots += '<span class="slot bad" title="Did not finish">✕</span>';
      else if (active && i === n) slots += '<span class="slot now" style="--p:' + Math.round(frac * 100) + '" title="Drawing…"><span>' + Math.round(frac * 100) + '%</span></span>';
      else slots += '<span class="slot" title="Waiting">' + (i + 1) + '</span>';
    }
    return '<div class="g"><span>' + esc(k) + '</span><div><div class="bar"><i style="width:' + pct + '%"></i></div><div class="slots">' + slots + '</div></div><span>' + (it ? n + '/' + t : 'waiting') + '</span></div>';
  }).join('');
}
async function startGen() {
  S.jobErr = ''; S.stopping = false; S.genKws = S.kws.slice();
  const r = await post('/api/generate', { keywords:S.kws, per:S.per, detail:S.detail, style:S.style });
  if (r.error) { S.jobErr = r.error; refresh(); viewKeywords(); return; }
  S.job = { id:r.id, items:[], per:S.per }; renderTop(); viewKeywords();
  const tick = setInterval(() => { if (S.job) drawGen(); }, 400);
  const t = setInterval(async () => {
    const j = await (await fetch('/api/job?id=' + r.id)).json();
    S.job = j; drawGen();
    if (j.state === 'running') return;
    clearInterval(t); clearInterval(tick);
    await refresh();
    j.items.forEach(it => {
      const lib = S.lib.find(l => l.folder.toLowerCase() === it.folder.toLowerCase());
      if (!lib) return;
      let set = S.sets.find(s => s.folder === lib.folder);
      if (!set) { set = { folder:lib.folder, title:it.keyword + (j.style && j.style !== 'line' ? ' (' + STYLES[j.style][0].toLowerCase() + ')' : ''), keyword:it.keyword, files:[], added:[], detail:j.detail, style:j.style }; S.sets.push(set); }
      set.files = lib.files; set.added = it.files; set.detail = j.detail; set.style = j.style; set.keyword = it.keyword;
    });
    S.jobErr = j.error || (j.state === 'stopped' ? 'Stopped. Icons that were already drawn are kept.' : j.items.some(it => it.failed) ? 'Some icons did not finish. Try again, or check the settings.' : '');
    S.job = null; S.stopping = false;
    // Only move the user on if they are still waiting on this screen. Otherwise leave them where they are.
    if (S.step === 1) { if (S.sets.length && !j.error) go(2); else viewKeywords(); }
    else { renderTop(); if (S.sets.length && !j.error) toast('Your new icons are ready. Open step 2, Pick icons.'); }
  }, 1500);
}

function viewPick() {
  document.documentElement.style.setProperty('--tile', S.size + 'px');
  $('#app').innerHTML = '<h1>2. Pick the icons you want</h1><p class="lead">Click icons to select them, then add them to the basket. <b>Tip:</b> right-click any icon to copy its SVG or a picture of it.</p><div class="row" style="margin:-6px 0 6px;color:var(--muted)"><label>Icon size <input type="range" id="tsz" min="32" max="160" value="' + S.size + '"> <span id="tszv">' + S.size + 'px</span></label></div>' +
    S.sets.map((set, si) => '<section class="section card"><div class="sh"><h2>' + esc(set.title) + ' <small>' + set.files.length + ' icons' + (set.added && set.added.length ? ', ' + set.added.length + ' new' : '') + (set.detail && set.keyword ? ' · ' + DETAIL[set.detail][0] + ' detail' : '') + '</small></h2><button class="btn small" data-all="' + si + '">Select all</button>' +
      (set.keyword ? '<button class="btn small" data-more="' + si + '"' + (S.ready ? '' : ' disabled') + '>Make ' + S.per + ' more</button>' : '') + '<button class="btn small" data-hide="' + si + '">Hide</button></div><div class="grid">' +
      set.files.map(f => { const k = key(set.folder, f); return '<button class="tile ' + (S.sel.has(k) ? 'sel' : '') + '" data-pick="' + esc(k) + '" aria-pressed="' + S.sel.has(k) + '"><span class="tick">✓</span>' + (inBasket(k) ? '<span class="badge">in basket</span>' : '') + ic(set.folder, f) + '<span style="font-size:12px;color:var(--muted)">' + esc(f.replace(/\.svg$/i, '')) + '</span></button>'; }).join('') + '</div></section>').join('');
  dockPick();
}
function dockPick() {

document.addEventListener('submit', e => {

const fmtGB = n => (n / 1e9).toFixed(1) + ' GB';
const fmtDur = t => { t = Math.round(t); if (!(t > 0)) return ''; if (t >= 3600) return Math.floor(t / 3600) + ' h ' + Math.round((t % 3600) / 60) + ' min'; if (t >= 60) return Math.round(t / 60) + ' min'; return t + ' s'; };

// Only one dialog is ever open: showing one closes the other.
