document.addEventListener('submit', e => {
  if (e.target.id !== 'kwform') return; e.preventDefault();
  $('#kwin').value.split(',').map(x => x.trim().toLowerCase()).filter(x => x && !S.kws.includes(x)).forEach(x => S.kws.push(x));
  viewKeywords(); $('#kwin').focus();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'libq') { S.libQ = t.value; drawLibGrid(); return; }
  if (t.id === 'vsub') { S.vary.subject = t.value; refreshVaryPrompt(); dockVary(); return; }
  if (t.id === 'vstr') { S.vary.strength = +t.value / 100; $('#vstrv').textContent = t.value + '%'; return; }
  if (t.id === 'vprompt') { S.vary.prompt = t.value; S.vary.promptEdited = true; return; }
  if (t.id === 'vkeep') { S.vary.keepSeed = t.checked; return; }
  if (t.id === 'tsz') { S.size = +t.value; document.documentElement.style.setProperty('--tile', S.size + 'px'); $('#tszv').textContent = S.size + 'px'; }
  else if (t.id === 'pvuse') S.pv.useCol = t.checked;
  else if (t.id === 'sz') { S.pv.size = +t.value; $('#sample').style.setProperty('--s', t.value + 'px'); $('#szv').textContent = t.value + 'px'; document.querySelectorAll('[data-pvsz]').forEach(x => x.classList.toggle('on', +x.dataset.pvsz === S.pv.size)); }
  else if (t.id === 'co') { S.pv.col = t.value; S.pv.touched = true; $('#sample').style.setProperty('--c', t.value); }
  else if (t.id === 'pvbgc') {
    S.pv.bg = t.value; $('#sample').style.background = t.value;
    document.querySelectorAll('[data-pvbg]').forEach(x => x.classList.toggle('on', x.dataset.pvbg === t.value.toLowerCase()));
    if (!S.pv.touched) { S.pv.col = pvInk(t.value); $('#co').value = S.pv.col; $('#sample').style.setProperty('--c', S.pv.col); }
  }
  else if (t.id === 'fname') { S.font = t.value; S.result = null; }
  else if (t.dataset && t.dataset.name !== undefined) { S.basket[+t.dataset.name].name = t.value; S.result = null; }
});
const fmtGB = n => (n / 1e9).toFixed(1) + ' GB';
const fmtDur = t => { t = Math.round(t); if (!(t > 0)) return ''; if (t >= 3600) return Math.floor(t / 3600) + ' h ' + Math.round((t % 3600) / 60) + ' min'; if (t >= 60) return Math.round(t / 60) + ' min'; return t + ' s'; };
function viewSettings() {
  const m = S.model, box = $('#modal'); if (!S.settings) { box.hidden = true; return; }
  const pct = Math.round(m.percent || 0);
  box.hidden = false;
  const left = fmtDur(m.eta), speed = m.speed ? (m.speed / 1e6).toFixed(1) + ' MB/s' : '';
  const w = S.welcome === 'model';
  const lead = m.ready ? 'Flux Schnell is downloaded and the app is pointed at it. You are ready to make icons.'
    : w ? 'Icon Forge draws your icons with an AI model called Flux Schnell. It runs on your own PC, so you download it once (about ' + fmtGB(m.size) + '). Check the folder below, then press Download. If your drive is short on space, press Change folder first.'
    : 'Icon Forge draws icons with the Flux Schnell model, which runs on your own PC. It is one download of about ' + fmtGB(m.size) + ', saved wherever you choose. Check the folder below, then press Download.';
  const warn = m.ready ? '' : '<div class="warnbox" role="alert"><span class="warnicon" aria-hidden="true">!</span><b>Icon Forge will not work until the AI model is downloaded.</b></div>';
  box.innerHTML = '<div class="modal" role="dialog" aria-label="' + (w ? 'Get the AI model' : 'Settings') + '"><h2>' + (w ? 'Get the AI model' : 'Settings') + '</h2><p class="lead" style="margin:0">' + lead + '</p>' + warn +
    '<div class="kv"><span>Model</span><span>' + esc(m.name) + ' (' + fmtGB(m.size) + ')</span>' +
    '<span>Status</span><span>' + (m.downloading ? 'Downloading… ' + pct + '%' : m.ready ? '<b style="color:var(--ok)">✓ Ready</b>' : 'Not installed') + '</span>' +
    '<span>' + (m.ready ? 'File' : 'Save to') + '</span><span><code>' + esc(m.ready ? m.path : m.folder) + '</code></span>' +
    (w ? '' : '<span>Library</span><span><code>' + esc(m.library || '') + '</code></span>' +
    '<span>Theme</span><span><span class="seg"><button data-theme-pick="light" class="' + (S.theme !== 'dark' ? 'on' : '') + '">Light</button><button data-theme-pick="dark" class="' + (S.theme === 'dark' ? 'on' : '') + '">Dark</button></span></span>') + '</div>' +
    (m.downloading ? '<div class="bar big"><i style="width:' + (m.percent || 0).toFixed(1) + '%"></i></div><div class="dlinfo"><b>' + fmtGB(m.got) + ' of ' + fmtGB(m.size) + '</b> · ' + pct + '%' + (speed ? ' · ' + speed : '') + (left ? ' · about ' + left + ' left' : '') + '</div>' : '') +
    (m.error ? '<div class="err">' + esc(m.error) + '</div>' : '') + (S.mErr ? '<div class="err" role="alert">' + esc(S.mErr) + '</div>' : '') +
    '<div class="row" style="margin-top:16px">' +
    (m.downloading ? '<button class="btn" id="mdlcancel">Cancel download</button>'
      : m.ready ? (w ? '<button class="btn primary" id="mclose">Start making icons</button>' : '<button class="btn" id="mbrowse">Use a different file…</button>')
      : '<button class="btn primary" id="mdl">Download Flux Schnell model</button><button class="btn" id="mchoose">Change folder…</button><button class="btn" id="mbrowse">I already have it…</button>') +
    (w ? '' : '<button class="btn" id="mopen">Open icon folder</button>') + (w && m.ready ? '' : '<button class="btn" id="mclose" style="margin-left:auto">' + (w && !m.downloading ? 'Not now' : 'Close') + '</button>') + '</div>' +
    '<p style="color:var(--muted);font-size:13px;margin:14px 0 0">Flux Schnell is free to use (Apache 2.0). Nothing else is sent anywhere; icons are made on this PC.' + (m.downloading ? ' You can close this window; the download carries on and the bar at the top of the app shows its progress.' : '') + '</p></div>';
}
function openSettings(on) {
  S.settings = on; S.mErr = ''; if (!on) S.welcome = null;
  viewSettings(); if (on) pollModel();
}
let modelTimer = null;
function pollModel() {
  clearInterval(modelTimer);
  modelTimer = setInterval(async () => { await refresh(); if (S.settings) viewSettings(); if (!S.model.downloading) clearInterval(modelTimer); }, 1000);
}
document.addEventListener('click', async e => {
  const t = e.target.closest('button, .modalbg'); if (!t) return;
  if (t.id === 'gear') { await refresh(); openSettings(true); return; }
  if (t.id === 'modal' && e.target === t) { openSettings(false); return; }
  if (t.id === 'mclose') { openSettings(false); return; }
  if (t.id === 'mdl') { await post('/api/model/download', {}); await refresh(); viewSettings(); pollModel(); return; }
  if (t.id === 'mdlcancel') { await post('/api/model/cancel', {}); await refresh(); viewSettings(); return; }
  // Errors show inside the dialog. A toast would sit behind it, and the browser's alert box looks out of place.
  if (t.id === 'mchoose') { const r = await post('/api/model/folder', {}); S.mErr = r.error || ''; await refresh(); viewSettings(); return; }
  if (t.id === 'mbrowse') { const r = await post('/api/model/browse', {}); S.mErr = r.error || ''; await refresh(); viewSettings(); return; }
  if (t.id === 'mopen') { post('/api/reveal', { slug:'' }); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.settings) openSettings(false); });
function applyTheme(t) { document.documentElement.dataset.theme = t; S.theme = t; }
// The theme follows Windows until you pick one in Settings (the gear). Your pick is saved and wins from then on.
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-theme-pick]'); if (!b) return;
  const t = b.dataset.themePick; applyTheme(t);
  await post('/api/theme', { theme:t });
  if (S.settings) viewSettings();
});
// ---- Keep the basket between runs ----
// The basket (picked icons, their names and edits) and the font name are saved a moment after any change. On the next start they come back,
// minus any icon that was deleted from the library in the meantime.
let basketSaved = '';
const basketSnapshot = () => JSON.stringify({ items:S.basket.map(b => ({ folder:b.folder, file:b.file, name:b.name, ed:b.ed })), font:S.font });
function restoreBasket() {
  const sv = S.savedBasket; S.savedBasket = null;
  if (!sv) { basketSaved = basketSnapshot(); return; }
  if (sv.font) S.font = sv.font;
  (sv.items || []).forEach(i => {
    const lib = S.lib.find(l => l.folder === i.folder);
    if (!lib || !lib.files.includes(i.file) || inBasket(key(i.folder, i.file))) return;
    const ed = Object.assign(newEd(), i.ed || {}); ed.del = Array.isArray(ed.del) ? ed.del : [];
    S.basket.push({ key:key(i.folder, i.file), folder:i.folder, file:i.file, name:i.name || i.file.replace(/\.svg$/i, '').replace(/_/g, '-').toLowerCase(), ed });
  });
  basketSaved = basketSnapshot();
}
setInterval(() => {
  const now = basketSnapshot(); if (now === basketSaved) return;
  basketSaved = now;
  post('/api/basket', JSON.parse(now)).catch(() => { basketSaved = ''; });   // on a failed save, try again at the next tick
}, 1500);
// First start: the only question is the AI model download. It shows again on later starts only while the model is missing.
refresh().then(() => {
  applyTheme(S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  restoreBasket();
  render();
  if (S.model.downloading || !S.model.ready) { S.welcome = 'model'; openSettings(true); }
});
</script></body></html>
